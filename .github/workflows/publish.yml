name: CI / Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read Emscripten version
        id: emsdk
        run: echo "version=$(grep -E '^EMSDK_VERSION :=' Makefile | awk '{print $3}')" >> $GITHUB_OUTPUT

      # make skips installing Emscripten when emsdk/.installed-<version> is present.
      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: |
            emsdk
            !emsdk/downloads
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build WASM
        run: make build

      - name: Run tests
        run: npm test

      - name: Upload dist
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
